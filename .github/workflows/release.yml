name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch CommonLibSSE-NG
        run: git clone --branch ng --depth 1 https://github.com/alandtse/CommonLibVR.git lib/commonlibsse-ng

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
          -DVCPKG_TARGET_TRIPLET=x64-windows-static-md

      - name: Build
        run: cmake --build build

      - name: Stamp plugin versions
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          Get-ChildItem plugins -Directory | ForEach-Object {
            $manifest = Join-Path $_.FullName 'manifest.json'
            $json = Get-Content $manifest -Raw | ConvertFrom-Json
            $json.version = $version
            $json | ConvertTo-Json -Depth 10 | Set-Content $manifest -Encoding utf8
          }
          Write-Output "stamped plugin manifests with $version"

      - name: Validate plugin manifests
        run: |
          Get-ChildItem plugins -Directory | ForEach-Object {
            $manifest = Join-Path $_.FullName 'manifest.json'
            if (-not (Test-Path $manifest)) { throw "missing manifest: $manifest" }
            $null = Get-Content $manifest -Raw | ConvertFrom-Json
            if (-not (Test-Path (Join-Path $_.FullName 'triggers'))) { throw "missing triggers: $($_.Name)" }
          }
          Write-Output "plugin manifests parsed"

      - name: Assemble package
        run: |
          $version = if ("${{ github.ref }}".StartsWith('refs/tags/')) { "${{ github.ref_name }}".TrimStart('v') } else { 'dev' }
          pwsh -NoProfile -File scripts/build-fomod.ps1 -Dll build/DragonSense.dll -Version $version
          Compress-Archive -Path package/DragonSense/* -DestinationPath "DragonSense-${{ github.ref_name }}.zip" -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: DragonSense-${{ github.ref_name }}
          path: |
            DragonSense-${{ github.ref_name }}.zip
            build/DragonSense.pdb

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: DragonSense-${{ github.ref_name }}.zip
          generate_release_notes: true
