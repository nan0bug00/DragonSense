name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch CommonLibSSE-NG
        run: git clone --branch ng --depth 1 https://github.com/alandtse/CommonLibVR.git lib/commonlibsse-ng

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
          -DVCPKG_TARGET_TRIPLET=x64-windows-static-md

      - name: Build
        run: cmake --build build

      - name: Assemble mod
        run: |
          New-Item -ItemType Directory -Force -Path package/DragonSense | Out-Null
          Copy-Item mod/* package/DragonSense -Recurse -Force
          Copy-Item build/DragonSense.dll package/DragonSense/SKSE/Plugins/ -Force
          Compress-Archive -Path package/DragonSense/* -DestinationPath "DragonSense-${{ github.ref_name }}.zip" -Force

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            DragonSense-${{ github.ref_name }}.zip
            build/DragonSense.pdb
          generate_release_notes: true
