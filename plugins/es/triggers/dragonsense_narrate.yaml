name: "dragonsense_narrate"
description: "DragonSense event delivered as an authored narration, so NPCs react to it now."

eventCriteria:
  eventType: "dragonsense_event"
  schemaConditions:
    - fieldPath: "mode"
      operator: "equals"
      value: "narrate"

response:
  type: "direct_narration"
  content: |-
    {% if event_json.kind == "roar_near" %}Un rugido de dragón estalla cerca, enorme y ronco, lo bastante fuerte para sentirse en el pecho.{% else if event_json.kind == "roar_distant" %}A lo lejos, algo inmenso ruge. El sonido resuena por la tierra y se apaga, y lo que lo produjo no está cerca.{% else if event_json.kind == "greybeard_call" %}Una voz inmensa desciende de la montaña, tan fuerte que parece venir del cielo mismo, y por un instante todo lo vivo en la región se queda quieto: "¡Dovahkiin!"{% else if event_json.kind == "bleakfalls_bats" %}Una colonia de murciélagos estalla desde la oscuridad de la cueva, con las alas batiendo tan cerca que se siente moverse el aire. Al pasar, el santuario interior queda a la vista. Desde el techo, un pilar de luz ilumina una plataforma con un sarcófago central y ornamentada cantería nórdica antigua.{% else if event_json.kind == "ustengrav_pillars" %}Piedra contra piedra mientras algo antiguo se mueve en la oscuridad, y luego la tumba vuelve a callar.{% else %}Algo se mueve cerca.{% endif %}

audience: "nearby_npcs"

enabled: true
probability: 1.0
cooldownSeconds: 5
priority: 7
