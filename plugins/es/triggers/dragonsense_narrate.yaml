name: "dragonsense_narrate"
description: "DragonSense event delivered as an authored narration, so NPCs react to it now."

eventCriteria:
  eventType: "dragonsense_event"
  schemaConditions:
    - fieldPath: "mode"
      operator: "equals"
      value: "narrate"

response:
  type: "direct_narration"
  content: |-
    {% if event_json.kind == "roar_near" %}*Un rugido de dragón estalla cerca, enorme y ronco, lo bastante fuerte para sentirse en el pecho.*{% else if event_json.kind == "roar_distant" %}*A lo lejos, algo inmenso ruge. El sonido resuena por la tierra y se apaga, y lo que lo produjo no está cerca.*{% else %}*Una voz inmensa desciende de la montaña, tan fuerte que parece venir del cielo mismo, y por un instante todo lo vivo en la región se queda quieto: "¡Dovahkiin!"*{% endif %}

audience: "nearby_npcs"

enabled: true
probability: 1.0
cooldownSeconds: 5
priority: 7
