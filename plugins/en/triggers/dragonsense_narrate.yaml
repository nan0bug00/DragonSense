name: "dragonsense_narrate"
description: "DragonSense event delivered as an authored narration, so NPCs react to it now."

eventCriteria:
  eventType: "dragonsense_event"
  schemaConditions:
    - fieldPath: "mode"
      operator: "equals"
      value: "narrate"

response:
  type: "direct_narration"
  content: |-
    {% if event_json.kind == "roar_near" %}A dragon's roar breaks out close by, huge and ragged, loud enough to feel in the chest.{% else if event_json.kind == "roar_distant" %}Far off, something vast roars. The sound echoes across the land and fades, and whatever made it is not close.{% else if event_json.kind == "greybeard_call" %}A vast voice rolls down from the mountain, so loud it seems to come from the sky itself, and for a moment every living thing in the hold goes still: "Dovahkiin!"{% else if event_json.kind == "bleakfalls_bats" %}A colony of bats bursts from the dark of the cave, their wings flapping close enough to feel the air move. As they fly past, the inner sanctum comes into view. From the ceiling a pillar of light illuminates a platform with a central casket and ornate ancient Nordic stonework.{% else if event_json.kind == "ustengrav_pillars" %}Stone grinds against stone as something ancient shifts in the dark, and then the tomb falls silent again.{% else %}Something stirs nearby.{% endif %}

audience: "nearby_npcs"

enabled: true
probability: 1.0
cooldownSeconds: 5
priority: 7
