name: "dragonsense_narrate"
description: "DragonSense event delivered as an authored narration, so NPCs react to it now."

eventCriteria:
  eventType: "dragonsense_event"
  schemaConditions:
    - fieldPath: "mode"
      operator: "equals"
      value: "narrate"

response:
  type: "direct_narration"
  content: |-
    {% if event_json.kind == "roar_near" %}*A dragon's roar breaks out close by, huge and ragged, loud enough to feel in the chest.*{% else if event_json.kind == "roar_distant" %}*Far off, something vast roars. The sound echoes across the land and fades, and whatever made it is not close.*{% else %}*A vast voice rolls down from the mountain, so loud it seems to come from the sky itself, and for a moment every living thing in the hold goes still: "Dovahkiin!"*{% endif %}

audience: "nearby_npcs"

enabled: true
probability: 1.0
cooldownSeconds: 5
priority: 7
