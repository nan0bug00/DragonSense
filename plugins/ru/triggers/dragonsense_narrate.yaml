name: "dragonsense_narrate"
description: "DragonSense event delivered as an authored narration, so NPCs react to it now."

eventCriteria:
  eventType: "dragonsense_event"
  schemaConditions:
    - fieldPath: "mode"
      operator: "equals"
      value: "narrate"

response:
  type: "direct_narration"
  content: |-
    {% if event_json.kind == "roar_near" %}Совсем рядом раздаётся драконий рёв — огромный и хриплый, от него дрожит в груди.{% else if event_json.kind == "roar_distant" %}Где-то вдали ревёт нечто огромное. Звук катится по земле и стихает, и то, что его издало, далеко.{% else if event_json.kind == "greybeard_call" %}Голос, огромный, как сама гора, скатывается вниз — такой громкий, будто идёт с неба, и на миг всё живое в округе замирает: «Довакин!»{% else if event_json.kind == "bleakfalls_bats" %}Из темноты пещеры вырывается колония летучих мышей; их крылья хлопают так близко, что чувствуешь движение воздуха. Когда они проносятся мимо, открывается внутреннее святилище. С потолка столб света освещает помост с центральным саркофагом и богатой древней нордской резьбой по камню.{% else if event_json.kind == "ustengrav_pillars" %}Камень скрежещет о камень — в темноте что-то древнее приходит в движение, — и гробница снова затихает.{% else %}Рядом что-то шевелится.{% endif %}

audience: "nearby_npcs"

enabled: true
probability: 1.0
cooldownSeconds: 5
priority: 7
