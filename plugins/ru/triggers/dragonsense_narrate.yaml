name: "dragonsense_narrate"
description: "DragonSense event delivered as an authored narration, so NPCs react to it now."

eventCriteria:
  eventType: "dragonsense_event"
  schemaConditions:
    - fieldPath: "mode"
      operator: "equals"
      value: "narrate"

response:
  type: "direct_narration"
  content: |-
    {% if event_json.kind == "roar_near" %}*Совсем рядом раздаётся драконий рёв — огромный и хриплый, от него дрожит в груди.*{% else if event_json.kind == "roar_distant" %}*Где-то вдали ревёт нечто огромное. Звук катится по земле и стихает, и то, что его издало, далеко.*{% else %}*Голос, огромный, как сама гора, скатывается вниз — такой громкий, будто идёт с неба, и на миг всё живое в округе замирает: «Довакин!»*{% endif %}

audience: "nearby_npcs"

enabled: true
probability: 1.0
cooldownSeconds: 5
priority: 7
