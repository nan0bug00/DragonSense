name: "dragonsense_narrate"
description: "DragonSense event delivered as an authored narration, so NPCs react to it now."

eventCriteria:
  eventType: "dragonsense_event"
  schemaConditions:
    - fieldPath: "mode"
      operator: "equals"
      value: "narrate"

response:
  type: "direct_narration"
  content: |-
    {% if event_json.kind == "roar_near" %}Un rugissement de dragon éclate tout près, énorme et rauque, assez puissant pour être ressenti dans la poitrine.{% else if event_json.kind == "roar_distant" %}Au loin, quelque chose d'immense rugit. Le son roule sur la terre et s'éteint, et ce qui l'a produit n'est pas proche.{% else if event_json.kind == "greybeard_call" %}Une voix immense descend de la montagne, si forte qu'elle semble venir du ciel lui-même, et pendant un instant tout ce qui vit dans la région se fige : « Dovahkiin ! »{% else if event_json.kind == "bleakfalls_bats" %}Une colonie de chauves-souris jaillit de l'obscurité de la grotte, leurs ailes battant si près qu'on sent l'air bouger. Tandis qu'elles passent, le sanctuaire intérieur apparaît. Du plafond, un pilier de lumière éclaire une plateforme avec un cercueil central et une pierre nordique ancienne ouvragée.{% else if event_json.kind == "ustengrav_pillars" %}La pierre grince contre la pierre tandis que quelque chose d'ancien bouge dans l'obscurité, puis le tombeau retombe dans le silence.{% else %}Quelque chose bouge tout près.{% endif %}

audience: "nearby_npcs"

enabled: true
probability: 1.0
cooldownSeconds: 5
priority: 7
