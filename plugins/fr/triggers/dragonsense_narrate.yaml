name: "dragonsense_narrate"
description: "DragonSense event delivered as an authored narration, so NPCs react to it now."

eventCriteria:
  eventType: "dragonsense_event"
  schemaConditions:
    - fieldPath: "mode"
      operator: "equals"
      value: "narrate"

response:
  type: "direct_narration"
  content: |-
    {% if event_json.kind == "roar_near" %}*Un rugissement de dragon éclate tout près, énorme et rauque, assez puissant pour être ressenti dans la poitrine.*{% else if event_json.kind == "roar_distant" %}*Au loin, quelque chose d'immense rugit. Le son roule sur la terre et s'éteint, et ce qui l'a produit n'est pas proche.*{% else %}*Une voix immense descend de la montagne, si forte qu'elle semble venir du ciel lui-même, et pendant un instant tout ce qui vit dans la région se fige : « Dovahkiin ! »*{% endif %}

audience: "nearby_npcs"

enabled: true
probability: 1.0
cooldownSeconds: 5
priority: 7
