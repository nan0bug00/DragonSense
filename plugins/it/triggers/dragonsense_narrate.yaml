name: "dragonsense_narrate"
description: "DragonSense event delivered as an authored narration, so NPCs react to it now."

eventCriteria:
  eventType: "dragonsense_event"
  schemaConditions:
    - fieldPath: "mode"
      operator: "equals"
      value: "narrate"

response:
  type: "direct_narration"
  content: |-
    {% if event_json.kind == "roar_near" %}*Un ruggito di drago esplode vicino, enorme e roco, abbastanza forte da sentirsi nel petto.*{% else if event_json.kind == "roar_distant" %}*In lontananza, qualcosa di immenso ruggisce. Il suono rotola sulla terra e svanisce, e ciò che lo ha prodotto non è vicino.*{% else %}*Una voce immensa rotola giù dalla montagna, così forte che sembra venire dal cielo stesso, e per un istante ogni essere vivente nella regione si immobilizza: "Dovahkiin!"*{% endif %}

audience: "nearby_npcs"

enabled: true
probability: 1.0
cooldownSeconds: 5
priority: 7
