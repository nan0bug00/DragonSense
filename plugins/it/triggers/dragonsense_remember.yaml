name: "dragonsense_remember"
description: "DragonSense event delivered as a stored event: no immediate reaction, but it stays in history."

eventCriteria:
  eventType: "dragonsense_event"
  schemaConditions:
    - fieldPath: "mode"
      operator: "equals"
      value: "remember"

response:
  type: "persistent_generic"
  content: |-
    {% if event_json.kind == "roar_near" %}Un ruggito di drago esplose vicino, enorme e roco, abbastanza forte da sentirsi nel petto.{% else if event_json.kind == "roar_distant" %}In lontananza, qualcosa di immenso ruggì. Il suono rotolò sulla terra e svanì, e ciò che lo aveva prodotto non era vicino.{% else %}Una voce immensa rotolò giù dalla montagna, e per un istante ogni essere vivente nella regione si immobilizzò: "Dovahkiin!"{% endif %}

audience: "nearby_npcs"

enabled: true
probability: 1.0
cooldownSeconds: 5
priority: 7
