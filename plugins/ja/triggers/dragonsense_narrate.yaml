name: "dragonsense_narrate"
description: "DragonSense event delivered as an authored narration, so NPCs react to it now."

eventCriteria:
  eventType: "dragonsense_event"
  schemaConditions:
    - fieldPath: "mode"
      operator: "equals"
      value: "narrate"

response:
  type: "direct_narration"
  content: |-
    {% if event_json.kind == "roar_near" %}*すぐ近くでドラゴンの咆哮が炸裂する。巨大で荒々しく、胸に響くほどだ。*{% else if event_json.kind == "roar_distant" %}*遠くで何か巨大なものが吼える。音は大地を渡って響き、やがて消えていく。その主はここではない。*{% else %}*山から巨大な声が転がり落ちてくる。空そのものから響くかのようで、一瞬、領内の生きとし生けるものすべてが息を潜める。「ドヴァキン！」*{% endif %}

audience: "nearby_npcs"

enabled: true
probability: 1.0
cooldownSeconds: 5
priority: 7
