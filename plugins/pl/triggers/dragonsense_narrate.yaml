name: "dragonsense_narrate"
description: "DragonSense event delivered as an authored narration, so NPCs react to it now."

eventCriteria:
  eventType: "dragonsense_event"
  schemaConditions:
    - fieldPath: "mode"
      operator: "equals"
      value: "narrate"

response:
  type: "direct_narration"
  content: |-
    {% if event_json.kind == "roar_near" %}Gdzieś blisko wybucha ryk smoka — ogromny i chrapliwy, tak głośny, że czuć go w piersi.{% else if event_json.kind == "roar_distant" %}Daleko stąd coś ogromnego ryczy. Dźwięk toczy się po ziemi i cichnie, a to, co go wydało, nie jest blisko.{% else if event_json.kind == "greybeard_call" %}Ogromny głos toczy się z góry, tak głośny, jakby dobiegał z samego nieba, i na chwilę wszystko, co żyje w krainie, zastyga: „Dovahkiin!”{% else if event_json.kind == "bleakfalls_bats" %}Z ciemności jaskini wyrywa się chmara nietoperzy, ich skrzydła trzepoczą tak blisko, że czuć ruch powietrza. Gdy przelatują, ukazuje się wewnętrzne sanktuarium. Ze stropu słup światła oświetla podest z centralnym sarkofagiem i zdobnym prastarym nordyckim kamieniarstwem.{% else if event_json.kind == "ustengrav_pillars" %}Kamień zgrzyta o kamień, gdy coś prastarego porusza się w ciemności, a potem grobowiec znów milknie.{% else %}Coś porusza się w pobliżu.{% endif %}

audience: "nearby_npcs"

enabled: true
probability: 1.0
cooldownSeconds: 5
priority: 7
