name: "dragonsense_narrate"
description: "DragonSense event delivered as an authored narration, so NPCs react to it now."

eventCriteria:
  eventType: "dragonsense_event"
  schemaConditions:
    - fieldPath: "mode"
      operator: "equals"
      value: "narrate"

response:
  type: "direct_narration"
  content: |-
    {% if event_json.kind == "roar_near" %}*Một tiếng gầm của rồng bùng lên ngay gần, to lớn và khàn đục, đủ lớn để cảm nhận trong lồng ngực.*{% else if event_json.kind == "roar_distant" %}*Xa xa, một thứ gì đó khổng lồ gầm lên. Âm thanh vang khắp mặt đất rồi tắt dần, và thứ đã tạo ra nó không ở gần.*{% else if event_json.kind == "greybeard_call" %}*Một giọng nói khổng lồ lăn xuống từ ngọn núi, lớn đến mức như thể phát ra từ chính bầu trời, và trong khoảnh khắc mọi sinh vật trong vùng đều sững lại: "Dovahkiin!"*{% else if event_json.kind == "bats" %}*Một đàn dơi lao ra từ bóng tối, một luồng cánh da quạt ngang đủ gần để cảm nhận không khí chuyển động.*{% else if event_json.kind == "ustengrav_pillars" %}*Đá nghiến vào đá khi một thứ gì đó cổ xưa chuyển động trong bóng tối, rồi lăng mộ lại chìm vào im lặng.*{% else %}*Có gì đó động đậy gần đây.*{% endif %}

audience: "nearby_npcs"

enabled: true
probability: 1.0
cooldownSeconds: 5
priority: 7
