name: "dragonsense_remember"
description: "DragonSense event delivered as a stored event: no immediate reaction, but it stays in history."

eventCriteria:
  eventType: "dragonsense_event"
  schemaConditions:
    - fieldPath: "mode"
      operator: "equals"
      value: "remember"

response:
  type: "persistent_generic"
  content: |-
    {% if event_json.kind == "roar_near" %}Một tiếng gầm của rồng bùng lên ngay gần, to lớn và khàn đục, đủ lớn để cảm nhận trong lồng ngực.{% else if event_json.kind == "roar_distant" %}Xa xa, một thứ gì đó khổng lồ đã gầm lên. Âm thanh vang khắp mặt đất rồi tắt dần, và thứ đã tạo ra nó không ở gần.{% else %}Một giọng nói khổng lồ lăn xuống từ ngọn núi, và trong khoảnh khắc mọi sinh vật trong vùng đều sững lại: "Dovahkiin!"{% endif %}

audience: "nearby_npcs"

enabled: true
probability: 1.0
cooldownSeconds: 5
priority: 7
