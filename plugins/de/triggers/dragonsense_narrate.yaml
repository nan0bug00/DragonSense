name: "dragonsense_narrate"
description: "DragonSense event delivered as an authored narration, so NPCs react to it now."

eventCriteria:
  eventType: "dragonsense_event"
  schemaConditions:
    - fieldPath: "mode"
      operator: "equals"
      value: "narrate"

response:
  type: "direct_narration"
  content: |-
    {% if event_json.kind == "roar_near" %}Ganz in der Nähe bricht das Brüllen eines Drachen los — gewaltig und rau, laut genug, um es in der Brust zu spüren.{% else if event_json.kind == "roar_distant" %}In der Ferne brüllt etwas Gewaltiges. Der Laut rollt über das Land und verklingt, und was ihn ausstieß, ist nicht nah.{% else if event_json.kind == "greybeard_call" %}Eine gewaltige Stimme rollt vom Berg herab, so laut, als käme sie vom Himmel selbst, und für einen Augenblick verstummt alles Lebendige in der Region: „Dovahkiin!“{% else if event_json.kind == "bleakfalls_bats" %}Ein Schwarm Fledermäuse bricht aus der Dunkelheit der Höhle hervor, ihre Flügel schlagen so nah, dass man die Luft spürt. Als sie vorbeiziehen, wird das innere Heiligtum sichtbar. Von der Decke fällt ein Lichtstrahl auf eine Plattform mit einem zentralen Sarg und kunstvoller alter nordischer Steinmetzarbeit.{% else if event_json.kind == "ustengrav_pillars" %}Stein mahlt gegen Stein, während sich etwas Uraltes in der Dunkelheit regt, und dann verstummt die Gruft wieder.{% else %}Etwas regt sich ganz in der Nähe.{% endif %}

audience: "nearby_npcs"

enabled: true
probability: 1.0
cooldownSeconds: 5
priority: 7
