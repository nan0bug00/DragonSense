name: "dragonsense_narrate"
description: "DragonSense event delivered as an authored narration, so NPCs react to it now."

eventCriteria:
  eventType: "dragonsense_event"
  schemaConditions:
    - fieldPath: "mode"
      operator: "equals"
      value: "narrate"

response:
  type: "direct_narration"
  content: |-
    {% if event_json.kind == "roar_near" %}一聲龍吼在近處炸響，巨大而粗礪，震得胸口發麻。{% else if event_json.kind == "roar_distant" %}遠處，某個龐然大物在咆哮。聲音越過大地迴盪，漸漸消散，但那東西並不近。{% else if event_json.kind == "greybeard_call" %}一個宏大的聲音從山巔滾落，響得彷彿來自天空本身，一時間，領地上所有活物都靜了下來：「都瓦克因！」{% else if event_json.kind == "bleakfalls_bats" %}一群蝙蝠從洞穴的黑暗中湧出，翅膀撲得極近，能感覺到空氣的震動。牠們飛過之後，內殿顯露出來。一束光從天花板照下，照亮中央的棺槨與雕飾精美的古代諾德石工。{% else if event_json.kind == "ustengrav_pillars" %}石頭與石頭摩擦作響，黑暗中某個古老的東西動了起來，隨後墓室重歸寂靜。{% else %}附近有什麼東西在動。{% endif %}

audience: "nearby_npcs"

enabled: true
probability: 1.0
cooldownSeconds: 5
priority: 7
