name: "dragonsense_narrate"
description: "DragonSense event delivered as an authored narration, so NPCs react to it now."

eventCriteria:
  eventType: "dragonsense_event"
  schemaConditions:
    - fieldPath: "mode"
      operator: "equals"
      value: "narrate"

response:
  type: "direct_narration"
  content: |-
    {% if event_json.kind == "roar_near" %}*Um rugido de dragão irrompe perto, enorme e rouco, forte o bastante para ser sentido no peito.*{% else if event_json.kind == "roar_distant" %}*Ao longe, algo imenso ruge. O som ecoa pela terra e se apaga, e o que o fez não está perto.*{% else if event_json.kind == "greybeard_call" %}*Uma voz imensa desce da montanha, tão alta que parece vir do próprio céu, e por um instante tudo o que vive na região fica imóvel: "Dovahkiin!"*{% else if event_json.kind == "bats" %}*Uma colónia de morcegos irrompe da escuridão, um turbilhão de couro que passa tão perto que se sente o ar mexer.*{% else if event_json.kind == "ustengrav_pillars" %}*Pedra raspa contra pedra enquanto algo antigo se move no escuro, e então a tumba volta a silenciar.*{% else %}*Algo se mexe por perto.*{% endif %}

audience: "nearby_npcs"

enabled: true
probability: 1.0
cooldownSeconds: 5
priority: 7
