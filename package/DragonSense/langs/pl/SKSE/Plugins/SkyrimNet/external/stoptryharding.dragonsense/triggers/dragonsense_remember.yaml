name: "dragonsense_remember"
description: "DragonSense event delivered as a stored event: no immediate reaction, but it stays in history."

eventCriteria:
  eventType: "dragonsense_event"
  schemaConditions:
    - fieldPath: "mode"
      operator: "equals"
      value: "remember"

response:
  type: "persistent_generic"
  content: |-
    {% if event_json.kind == "roar_near" %}Gdzieś blisko wybuchł ryk smoka — ogromny i chrapliwy, tak głośny, że czuć go było w piersi.{% else if event_json.kind == "roar_distant" %}Daleko stąd coś ogromnego ryczało. Dźwięk toczył się po ziemi i cichł, a to, co go wydało, nie było blisko.{% else %}Ogromny głos potoczył się z góry, i na chwilę wszystko, co żyje w krainie, zastygło: „Dovahkiin!”{% endif %}

audience: "nearby_npcs"

enabled: true
probability: 1.0
cooldownSeconds: 5
priority: 7
