name: "dragonsense_remember"
description: "DragonSense event delivered as a stored event: no immediate reaction, but it stays in history."

eventCriteria:
  eventType: "dragonsense_event"
  schemaConditions:
    - fieldPath: "mode"
      operator: "equals"
      value: "remember"

response:
  type: "persistent_generic"
  content: |-
    {% if event_json.kind == "roar_near" %}Un rugissement de dragon éclata tout près, énorme et rauque, assez puissant pour être ressenti dans la poitrine.{% else if event_json.kind == "roar_distant" %}Au loin, quelque chose d'immense rugit. Le son roula sur la terre et s'éteignit, et ce qui l'avait produit n'était pas proche.{% else %}Une voix immense descendit de la montagne, et pendant un instant tout ce qui vit dans la région se figea : « Dovahkiin ! »{% endif %}

audience: "nearby_npcs"

enabled: true
probability: 1.0
cooldownSeconds: 5
priority: 7
