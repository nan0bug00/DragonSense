name: "dragonsense_remember"
description: "DragonSense event delivered as a stored event: no immediate reaction, but it stays in history."

eventCriteria:
  eventType: "dragonsense_event"
  schemaConditions:
    - fieldPath: "mode"
      operator: "equals"
      value: "remember"

response:
  type: "persistent_generic"
  content: |-
    {% if event_json.kind == "roar_near" %}すぐ近くでドラゴンの咆哮が炸裂した。巨大で荒々しく、胸に響くほどだった。{% else if event_json.kind == "roar_distant" %}遠くで何か巨大なものが吼えた。音は大地を渡って響き、やがて消えていった。その主はここではなかった。{% else %}山から巨大な声が転がり落ちてきた。一瞬、領内の生きとし生けるものすべてが息を潜めた。「ドヴァキン！」{% endif %}

audience: "nearby_npcs"

enabled: true
probability: 1.0
cooldownSeconds: 5
priority: 7
