name: "dragonsense_remember"
description: "DragonSense event delivered as a stored event: no immediate reaction, but it stays in history."

eventCriteria:
  eventType: "dragonsense_event"
  schemaConditions:
    - fieldPath: "mode"
      operator: "equals"
      value: "remember"

response:
  type: "persistent_generic"
  content: |-
    {% if event_json.kind == "roar_near" %}Um rugido de dragão irrompeu perto, enorme e rouco, forte o bastante para ser sentido no peito.{% else if event_json.kind == "roar_distant" %}Ao longe, algo imenso rugiu. O som ecoou pela terra e se apagou, e o que o fez não estava perto.{% else %}Uma voz imensa desceu da montanha, e por um instante tudo o que vive na região ficou imóvel: "Dovahkiin!"{% endif %}

audience: "nearby_npcs"

enabled: true
probability: 1.0
cooldownSeconds: 5
priority: 7
