name: "dragonsense_narrate"
description: "DragonSense event delivered as an authored narration, so NPCs react to it now."

eventCriteria:
  eventType: "dragonsense_event"
  schemaConditions:
    - fieldPath: "mode"
      operator: "equals"
      value: "narrate"

response:
  type: "direct_narration"
  content: |-
    {% if event_json.kind == "roar_near" %}*Um rugido de dragão irrompe perto, enorme e rouco, forte o bastante para ser sentido no peito.*{% else if event_json.kind == "roar_distant" %}*Ao longe, algo imenso ruge. O som ecoa pela terra e se apaga, e o que o fez não está perto.*{% else %}*Uma voz imensa desce da montanha, tão alta que parece vir do próprio céu, e por um instante tudo o que vive na região fica imóvel: "Dovahkiin!"*{% endif %}

audience: "nearby_npcs"

enabled: true
probability: 1.0
cooldownSeconds: 5
priority: 7
